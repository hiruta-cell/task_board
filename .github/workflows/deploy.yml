# main へのプッシュ時にビルドし、GitHub Pages へ公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 画面から手動実行も可能

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行時は古いデプロイを待たずに最新だけ反映
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ビルドして dist/ を成果物としてアップロード
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # アップロードした成果物を Pages に公開
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 古い実行を Re-run したときに古い版で上書きしないよう、
      # このコミットが main の最新でなければ公開せずに失敗させる
      - name: main の最新コミットか確認
        run: |
          latest=$(git ls-remote "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::error::このコミット（${{ github.sha }}）は main の最新（${latest}）ではないため公開しません。最新の実行を Re-run するか、Run workflow から実行してください。"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
